# Builds the Windows installer, signs the updater artifact and publishes a draft
# GitHub release with latest.json – the file the in-app updater polls
# (tauri.conf.json → plugins.updater.endpoints). Publish the draft to ship it.
#
# Trigger: a tag like v0.2.0 on the public repository, created by the snapshot script
# (docs/releasing.md). The `versions` job fails the run when the tag and the version fields
# in the tree differ; the `ci` job runs every check of ci.yml (clippy, tests, cargo audit /
# deny, npm audit, lint, tsc, README pair) on the tagged commit. The build starts only when
# both have passed.
#
# Every third-party action is pinned to a full commit SHA (the comment names the release):
# the release job holds the updater signing key and a token that can write releases, so a
# moved tag must not slip into it. The Rust toolchain comes from rust-toolchain.toml.
name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the job that creates the release gets write access.
permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches every version field
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require("fs");
          const want = process.env.TAG.replace(/^v/, "");
          const json = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
          const found = [];
          const pkg = json("app/package.json");
          found.push(["app/package.json", pkg.version]);
          const lock = json("app/package-lock.json");
          found.push(["app/package-lock.json (version)", lock.version]);
          found.push(['app/package-lock.json (packages[""])', lock.packages[""].version]);
          found.push(["app/src-tauri/tauri.conf.json", json("app/src-tauri/tauri.conf.json").version]);
          const cargo = fs.readFileSync("Cargo.toml", "utf8");
          const section = (cargo.split(/^\[workspace\.package\]\s*$/m)[1] || "").split(/^\[/m)[0];
          const ws = /^version\s*=\s*"([^"]+)"/m.exec(section);
          found.push(["Cargo.toml [workspace.package]", ws && ws[1]]);
          const cargoLock = fs.readFileSync("Cargo.lock", "utf8");
          for (const m of cargoLock.matchAll(/^name = "(vectasim[^"]*)"\r?\nversion = "([^"]+)"/gm)) {
            found.push([`Cargo.lock ${m[1]}`, m[2]]);
          }
          if (!found.some(([where]) => where.startsWith("Cargo.lock"))) found.push(["Cargo.lock vectasim*", "missing"]);
          let bad = 0;
          for (const [where, v] of found) {
            if (v === want) console.log(`ok     ${where} = ${v}`);
            else { console.log(`::error::${where} is ${v}, the tag says ${want}`); bad++; }
          }
          if (bad) process.exit(1);
          JS

  # same jobs as on a push; read-only token, no secrets passed on
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [versions, ci]
    runs-on: windows-latest
    permissions:
      contents: write # tauri-action creates the draft release and uploads the assets
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # installs the pinned toolchain named in rust-toolchain.toml
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "VectaSim ${{ github.ref_name }}"
          # becomes `notes` in latest.json, shown in the app under Settings → Updates
          releaseBody: "What's new is listed in CHANGELOG.md. The installer updates an existing installation."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
