# Checks on every push to main and every pull request; release.yml calls the same jobs for the
# tagged commit before it builds. Third-party actions are pinned to a commit SHA (the comment
# names the release); the Rust toolchain comes from rust-toolchain.toml.
#
# Not (yet) part of it: `cargo fmt --check` – rustfmt.toml exists, but the tree has not been
# formatted with it in one go (see DEVELOPMENT.md → Tests and checks → Tools).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml runs these jobs, so a release never
# cancels (or waits for) the CI run of a push
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the pinned toolchain (with clippy and rustfmt) named in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --locked: fails when Cargo.lock is out of date instead of silently updating it
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # caches ~/.cargo/bin as well, so cargo-audit and cargo-deny are compiled once per cache key
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit
      - run: cargo install cargo-audit --locked --version 0.22.2
      # built from crates.io (immutable per version, --locked) like cargo-audit instead of
      # EmbarkStudios/cargo-deny-action, whose Dockerfile downloads the release binary without
      # a checksum check
      - run: cargo install cargo-deny --locked --version 0.20.2
      # RustSec advisories against Cargo.lock; vulnerabilities fail the job, warnings
      # (unmaintained / unsound crates) are printed only
      - run: cargo audit
      # licences, banned or duplicate crates, crate sources and advisories as configured in deny.toml
      - run: cargo deny --locked check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # README.md and README.de.md: same headings, lists, tables, images and code blocks
      - run: node scripts/readme-pair-check.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci fails when package-lock.json does not match package.json
      - run: npm ci
      # known vulnerabilities in what ships in the installer (production dependencies) fail the
      # job at high/critical; dev tooling (Vite, ESLint, Vitest) never reaches users and is left out
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Keeps the release-profile build cache warm on the public main so the next tag's release
  # job (release.yml, same shared-key) restores the compiled dependencies instead of building
  # 16 minutes from cold. Public repository only (free minutes; private Windows minutes count
  # double), pushes to main only (a tag run could not save a reusable cache anyway). The
  # frontend is built first because tauri::generate_context! embeds the dist folder.
  release-cache:
    if: github.repository == 'unwritten-dev/VectaSim' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: release
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo build --release --locked --manifest-path app/src-tauri/Cargo.toml
