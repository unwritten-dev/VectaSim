[package]
name = "vectasim-store"
description = "Local-first SQLite logbook: flights, touchdowns, phase events and compressed tracks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
vectasim-core = { path = "../vectasim-core" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
quick-xml = "0.42"
rusqlite = { version = "0.32", features = ["bundled"] }
