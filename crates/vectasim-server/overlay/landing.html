<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="title.landing">VectaSim Landung</title>
<link rel="stylesheet" href="/overlay/overlay.css">
</head>
<body data-page="landing">
<div class="landing-wrap">
  <div class="landing" data-f="card" role="status" aria-live="polite">
    <div class="head"><span class="label" data-t="label.landing">Landung</span><span class="band" data-f="band"></span><span class="src" data-f="src"></span></div>
    <div class="rate num" data-f="rate">–</div>
    <div class="facts">
      <div class="fact"><span class="label" data-t="label.g">g-Last</span><span class="v num" data-f="g">–</span></div>
      <div class="fact"><span class="label">Bounces</span><span class="v num" data-f="bounces">–</span></div>
    </div>
    <div class="facts">
      <div class="fact"><span class="label" data-t="label.rwy">Piste</span><span class="v num" data-f="rwy">–</span></div>
      <div class="fact"><span class="label" data-t="label.tdz">Aufsetzpunkt</span><span class="v num" data-f="tdz">–</span></div>
    </div>
    <div class="facts">
      <div class="src" data-f="stable"></div>
    </div>
  </div>
</div>
<script src="/overlay/overlay.js"></script>
</body>
</html>
