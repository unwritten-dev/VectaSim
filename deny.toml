# cargo-deny (https://embarkstudios.github.io/cargo-deny/): `cargo deny --locked check` in CI.
# Checks the dependency graph of the Windows build – the one VectaSim ships and the one
# THIRD-PARTY-NOTICES.md lists – for RustSec advisories, licences outside the allowlist below,
# wildcard versions and crates from anywhere but crates.io.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# vulnerabilities and yanked versions always fail; unmaintained crates only when VectaSim
# depends on them directly (transitive ones come with Tauri and are reported by `cargo audit`)
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# an entry needs the advisory ID and why it does not apply, e.g.
# { id = "RUSTSEC-0000-0000", reason = "…" }
ignore = []

[licenses]
# The licences of the crates in THIRD-PARTY-NOTICES.md (Rust section). A crate whose licence
# expression cannot be satisfied with these fails the check – add it to the notices first.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# the workspace crates (MIT, see LICENSE) are not published
ignore = true

[bans]
# Tauri pulls several majors of a few crates (windows-sys, thiserror, …): reported, not fatal
multiple-versions = "warn"
wildcards = "deny"
# path dependencies between the workspace crates have no version
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
