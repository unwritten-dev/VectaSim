# cargo-about configuration for THIRD-PARTY-LICENSES.txt (scripts/third-party-licenses.mjs).
# Same graph as deny.toml and the Rust table in THIRD-PARTY-NOTICES.md: the Windows build,
# normal dependencies only (build and dev dependencies are not shipped), workspace crates skipped.
# The accepted list mirrors [licenses] allow in deny.toml, in order of preference: for an
# "A OR B" expression the first accepted licence in this list is the one reproduced.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
